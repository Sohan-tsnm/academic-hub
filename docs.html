<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sohan's Academic Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Notes, lab reports and books — Fabric Engineering, BUTEX">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --theme-color: #2c6e49; /* change this hex to change the whole site's accent color */
    }
    .sidebar { border-right: 1px solid #eee; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: "Sohan's Academic Hub",
      repo: '', // put your GitHub repo URL here later, e.g. 'https://github.com/yourname/sohan-academic-hub'
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      search: {
        placeholder: 'Search notes...',
        noData: 'No results found.',
        depth: 4
      },
      pagination: {
        crossChapter: true
      }
    }
  </script>
  <!-- Core engine -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <!-- Search box plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <!-- Prev/Next page buttons -->
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <!-- Code syntax highlighting (useful if you paste code snippets in notes) -->
  <script src="//cdn.jsdelivr.net/npm/prismjs/components/prism-python.min.js"></script>
</body>
</html>
